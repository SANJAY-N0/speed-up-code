<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Java to Automation Script Generator</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 30px;
      background-color: #121212;
      color: #e0e0e0;
    }
    h2 { margin-bottom: 8px; }
    p { color: #888; font-size: 14px; margin-top: 0; }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
      background: #181818;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #2a2a2a;
    }
    .control-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
      justify-content: center;
    }
    .control-item label {
      font-size: 12px;
      font-weight: 600;
      color: #aaa;
    }
    .control-item input[type="number"] {
      background: #222;
      border: 1px solid #444;
      color: #fff;
      padding: 8px 10px;
      border-radius: 5px;
      font-size: 14px;
    }
    /* Switch toggle styling */
    .switch {
      position: relative;
      display: inline-block;
      width: 48px;
      height: 24px;
      margin-top: 4px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #333;
      transition: .3s;
      border-radius: 24px;
      border: 1px solid #555;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #238636;
      border-color: #2ea043;
    }
    input:checked + .slider:before {
      transform: translateX(24px);
    }
    .toggle-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #buzzerLabelStatus {
      font-size: 13px;
      color: #7ee787;
      font-weight: bold;
    }
    textarea {
      width: 100%;
      height: 220px;
      background: #1e1e1e;
      color: #79c0ff;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 12px;
      font-family: Consolas, monospace;
      font-size: 13px;
      box-sizing: border-box;
      resize: vertical;
    }
    .btn-group {
      margin: 15px 0;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    button {
      background: #238636;
      color: white;
      border: none;
      padding: 10px 18px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #2ea043; }
    button.copy-btn {
      background: #30363d;
    }
    button.copy-btn:hover { background: #3c444d; }
    #status {
      font-size: 14px;
      color: #7ee787;
      margin-left: 10px;
    }
  </style>
</head>
<body>

  <h2>Auto-Runner Script Generator</h2>
  <p>Configure speed, chunk size, and alert preferences, paste Java code, and generate the script.</p>

  <div class="controls">
    <div class="control-item">
      <label for="charDelayInput">Delay per Step (ms):</label>
      <input type="number" id="charDelayInput" value="15" min="0">
    </div>
    <div class="control-item">
      <label for="chunkSizeInput">Characters per Step:</label>
      <input type="number" id="chunkSizeInput" value="1" min="1">
    </div>
    <div class="control-item">
      <label for="runWaitInput">Compile Wait Time (ms):</label>
      <input type="number" id="runWaitInput" value="6000" min="500">
    </div>
    <div class="control-item">
      <label>Audio Buzzer Alert:</label>
      <div class="toggle-wrapper">
        <label class="switch">
          <input type="checkbox" id="buzzerToggle" checked onchange="updateBuzzerLabel()">
          <span class="slider"></span>
        </label>
        <span id="buzzerLabelStatus">ON</span>
      </div>
    </div>
  </div>

  <textarea id="javaInput" placeholder="Paste your Java code here..."></textarea>

  <div class="btn-group">
    <button onclick="generateScript()">Generate JavaScript</button>
    <button class="copy-btn" onclick="copyOutput()">Copy Generated Script</button>
    <span id="status"></span>
  </div>

  <textarea id="jsOutput" readonly placeholder="Generated JavaScript will appear here..."></textarea>

  <script>
    function updateBuzzerLabel() {
      const isChecked = document.getElementById('buzzerToggle').checked;
      const label = document.getElementById('buzzerLabelStatus');
      label.innerText = isChecked ? "ON" : "OFF";
      label.style.color = isChecked ? "#7ee787" : "#888";
    }

    function generateScript() {
      const javaCode = document.getElementById('javaInput').value;
      const charDelay = parseInt(document.getElementById('charDelayInput').value) || 15;
      const chunkSize = parseInt(document.getElementById('chunkSizeInput').value) || 1;
      const runWaitTime = parseInt(document.getElementById('runWaitInput').value) || 6000;
      const buzzerEnabled = document.getElementById('buzzerToggle').checked;

      if (!javaCode.trim()) {
        alert("Please paste some Java code first.");
        return;
      }

      const escapedJavaCode = JSON.stringify(javaCode);

      const buzzerSection = buzzerEnabled ? `
    // Audio Alert Setup (Web Audio API)
    let audioCtx = null;
    let osc = null;
    let isBuzzing = false;

    function startBuzzer() {
        if (isBuzzing) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(520, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);

        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.start();
        isBuzzing = true;
        console.log("%c[ALERT] Solution executed! Press ANY KEY to silence buzzer.", "color: lime; font-weight: bold; font-size: 14px;");

        window.addEventListener('keydown', stopBuzzer, { once: true });
    }

    function stopBuzzer() {
        if (isBuzzing && osc) {
            try {
                osc.stop();
                audioCtx.close();
            } catch (e) {}
            isBuzzing = false;
            console.log("Buzzer silenced.");
        }
    }` : `    // Audio Buzzer is DISABLED
    function startBuzzer() {}`;

      const template = `(async () => {
    const logicCandidates = [
        ${escapedJavaCode}
    ];

    const charDelay = ${charDelay}; // Milliseconds between chunks
    const chunkSize = ${chunkSize}; // Characters typed per step
    const runWaitTime = ${runWaitTime}; // Compilation check delay

    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
${buzzerSection}

    async function typeCodeIntoEditor(code) {
        const monacoModel = window.monaco?.editor?.getModels()?.[0];
        const cmInstance = document.querySelector('.CodeMirror')?.CodeMirror;
        const aceEditor = window.ace && document.querySelector('.ace_editor') ? window.ace.edit(document.querySelector('.ace_editor')) : null;
        const textarea = document.querySelector('textarea:focus') || document.querySelector('textarea');

        if (monacoModel) monacoModel.setValue('');
        else if (cmInstance) cmInstance.setValue('');
        else if (aceEditor) aceEditor.setValue('', -1);
        else if (textarea) textarea.value = '';

        let accumulated = '';
        for (let i = 0; i < code.length; i += chunkSize) {
            const chunk = code.slice(i, i + chunkSize);
            accumulated += chunk;

            if (monacoModel) monacoModel.setValue(accumulated);
            else if (cmInstance) cmInstance.replaceRange(chunk, cmInstance.getCursor());
            else if (aceEditor) aceEditor.insert(chunk);
            else if (textarea) {
                textarea.value = accumulated;
                textarea.dispatchEvent(new Event('input', { bubbles: true }));
            }
            if (charDelay > 0) await sleep(charDelay);
        }
    }

    function hasError() {
        const text = document.body.innerText.toLowerCase();
        const errorKeywords = ['compilation error', 'runtime error', 'wrong answer', 'syntaxerror', 'exception', 'failed'];
        return errorKeywords.some(keyword => text.includes(keyword));
    }

    for (let index = 0; index < logicCandidates.length; index++) {
        console.log(\`[AutoRunner] Typing logic attempt #\${index + 1}...\`);
        await typeCodeIntoEditor(logicCandidates[index]);
        await sleep(500);

        const runBtn = document.querySelector('.programming_run_button') || 
                       [...document.querySelectorAll('button')].find(b => b.textContent.includes('Compile & Run'));

        if (!runBtn) {
            console.error("Compile & Run button not found.");
            return;
        }

        console.log("[AutoRunner] Clicking Compile & Run...");
        runBtn.click();

        await sleep(runWaitTime);

        if (hasError() && index < logicCandidates.length - 1) {
            console.warn(\`[AutoRunner] Attempt #\${index + 1} produced errors. Switching to next logic candidate...\`);
        } else {
            console.log(\`[AutoRunner] Completed execution for attempt #\${index + 1}.\`);
            startBuzzer();
            break;
        }
    }
})();`;

      document.getElementById('jsOutput').value = template;
      document.getElementById('status').innerText = "Generated successfully!";
    }

    function copyOutput() {
      const output = document.getElementById('jsOutput');
      if (!output.value) return;
      output.select();
      navigator.clipboard.writeText(output.value);
      document.getElementById('status').innerText = "Copied to clipboard!";
    }
  </script>
</body>
</html>
